[project]
name = "recon-bridge"
version = "0.1.0"
description = "Authorization-aware recon toolkit exposed over MCP, drivable by any LLM (Claude, ChatGPT, etc.)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dan" }]

dependencies = [
    "mcp>=2.0",
    "pyyaml>=6.0",
    "dnspython>=2.6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Only needed if you want the ChatGPT / OpenAI bridge.
openai = ["openai>=1.40.0"]
dev = ["pytest>=8.0", "ruff>=0.6.0"]

[project.scripts]
# Launch the MCP server from the command line.
recon-bridge = "recon_bridge.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recon_bridge"]
